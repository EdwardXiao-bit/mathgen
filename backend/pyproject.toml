[project]
name = "mathgen-backend"
version = "0.1.0"
description = "mathgen 后端：出题引擎、判分、渲染与导出"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "pydantic>=2.14",
    "jinja2>=3.1",
    "httpx>=0.28",
    "qrcode[pil]>=8.2",
    "playwright>=1.64",
    "python-docx>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.engine", "app.grading", "app.contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
