name: release

# 打 tag（v1.0.0-rc1 这种）时自动做四件事：
#   1. 构建 wheel（**内含前端产物**，装上就有界面）
#   2. 构建 Docker 镜像并**先在 runner 上冒烟跑通**（含真 PDF 导出），再推 GHCR 多架构镜像
#   3. 用 CHANGELOG 里对应版本那一节创建 GitHub Release，并附上 wheel
#   4. 把 npm 启动器 `mathgen-cli` 发到 registry（trusted publishing，不需要长期 token；
#      见 npm 作业的注释与 docs/00 的 D87）
#
# 手动触发（workflow_dispatch）只构建与冒烟，不推 GHCR、不发 Release：
# 镜像里有 Chromium，本机又没装 Docker，CI 是这个 Dockerfile 唯一的验证途径。
# 手选两个平台（linux/amd64,linux/arm64）时会额外在 QEMU 里把 arm64 也构建一遍，
# 用来验证 Dockerfile 在 arm64 上可构建（arm64 镜像不做运行时冒烟，见 D87）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台；选两个会额外验证 arm64 也能构建（不推镜像）"
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------ wheel + Release
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pyproject / app.__version__ 一致
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          py = tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"]
          src = open("backend/app/__init__.py", encoding="utf-8").read()
          got = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          if not tag.startswith("v"):
              # 手动触发（workflow_dispatch，ref 是分支名）：没有 tag 可对，就只校验
              # pyproject 与 app.__version__ 一致；Release / GHCR 两步都带 tag 条件，不会跑。
              print(f"手动触发（ref={tag}）：跳过 tag 校验，只比 pyproject 与 app.__version__")
              if py != got:
                  sys.exit(f"版本号不一致：pyproject={py}  app.__version__={got}")
              print(f"pyproject={py}  app.__version__={got}  ✔")
              sys.exit(0)
          # tag 用人类习惯的 v1.0.0-rc1，PEP 440 里必须写 1.0.0rc1 —— 归一化之后再比。
          # （tag 里的连字符不能省：下面的 prerelease 判据靠它区分预发布。）
          want = re.sub(r"-(?=(rc|a|b|post|dev)\d)", "", tag[1:])
          print(f"tag={tag} -> {want}   pyproject={py}   app.__version__={got}")
          if not (want == py == got):
              sys.exit("版本号三处不一致：tag / backend/pyproject.toml / backend/app/__init__.py")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建前端
        working-directory: frontend
        run: |
          # pnpm 版本显式钉死（与 Dockerfile 同一口径）：不依赖 package.json 的
          # packageManager 字段，因为该字段会让部分 pnpm 安装往 lockfile 里补写
          # packageManagerDependencies，使 --frozen-lockfile 失败
          # （实测：CI run 38940469884 的 docker job）。
          npm i -g pnpm@12.5.1
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: 把前端产物放进包里（安装版才有界面）
        run: cp -r frontend/dist backend/app/static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade build
          python -m build backend --outdir dist
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          static = [n for n in names if "/static/" in n]
          print(f"{whl}: {len(names)} 个条目，其中 static/{len(static)} 个")
          assert static, "wheel 里没有前端产物 —— `cp -r frontend/dist backend/app/static` 或 package-data 配错了"
          assert any(n.endswith("index.html") for n in static), "static 里没有 index.html"
          PY

      - name: 生成校验和（下载的人可以自己核）
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      - name: 生成 release 说明（取 CHANGELOG 里对应版本那一节）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, re
          want = os.environ["GITHUB_REF_NAME"][1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(want)}\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = m.group(0).strip() if m else f"## {want}\n\n（CHANGELOG.md 里没有这一节）"
          # 下面三处都**不能照抄人写的样子**：
          #   · 镜像标签去 v（与 docker push 那边的 ${GITHUB_REF_NAME#v} 必须一致）
          #   · npm 版本号本来就没有 v 前缀（写成 @v1.0.0-rc1 会 404，第一版发布时真的写错过）
          #   · npm 的**包名是 mathgen-cli**，不是 `mathgen`：npm 判定 `mathgen` 与早已存在的
          #     `math-gen` 太像（去标点后同名），`npm publish mathgen` 被 403 挡住；
          #     而包里的命令仍然叫 `mathgen`（`bin` 没变），所以命令要写 `npx mathgen-cli@VER`
          install = """
          ---

          ### 怎么跑起来（四种方式，任选一种）

          | 方式 | 命令 | 需要什么 |
          | --- | --- | --- |
          | 源码一键脚本 | `scripts\\start.ps1`（Windows）/ `./scripts/start.sh`（macOS / Linux） | Python 3.12+ |
          | Docker | `docker run --rm -p 8000:8000 -v mathgen-data:/data ghcr.io/edwardxiao-bit/mathgen:VER` | Docker（`linux/amd64` 与 `linux/arm64` 两个架构） |
          | npm 启动器 | `npx mathgen-cli@VER` | Node 18+ 与 Python 3.12+ |
          | pip | `pip install 下面这个 wheel`，然后 `mathgen` | Python 3.12+ |

          > npm 启动器是**新包名**，npm 对它有 staged publishing 的**人工审核**这一步；
          > 本版本已通过审核，`rc` 与 `latest` 都指向它，所以 `npx mathgen-cli@VER` 与裸写
          > `npx mathgen-cli` 拿到的是同一份。查已发布的版本：`npm view mathgen-cli versions`。

          跑起来后浏览器打开 <http://127.0.0.1:8000/teacher>；要让学生在同一局域网访问，
          用 `--host 0.0.0.0`（脚本里是 `-Lan`）并放行 8000 端口。
          """.replace("VER", want)
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body + install)
          PY

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: mathgen ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ------------------------------------------------------------ npm 启动器
  # 走 npm 的 **trusted publishing**（OIDC）：GitHub Actions 用 id-token 换一次性发布凭据，
  # 仓库里**不存任何 npm token**。为什么不用 token（2026 年的 npm 现实）：
  #   · 2025-11 起 npm 只支持 granular token，2025-12-09 起 classic token 全部吊销；
  #   · granular token 想免 OTP 必须开「Bypass 2FA」，那是一条**长期有效、可被偷**的发布凭据，
  #     社区事故里被偷的就是它；
  #   · trusted publishing 是 npm 给 CI 的官方无人值守路径，还顺带产出 provenance（构建来源可验证）。
  # 一次性前提（在 npmjs.com 网页上配，不进仓库；配完把仓库变量 NPM_TRUSTED_PUBLISHING 设为 true，
  # 否则本作业被跳过——没配之前打 tag 也不会红）：
  #   mathgen-cli → Settings → Trusted publishing → GitHub Actions
  #   Organization/user = EdwardXiao-bit，Repository = mathgen，Workflow = release.yml
  npm:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing 换凭据就靠它
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 升级 npm（trusted publishing 需要 npm ≥ 11.5.1）
        run: |
          npm install -g npm@latest
          npm --version

      - name: 校验 npm/package.json 与 tag 一致
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          # tag 是 v1.0.0-rc3、npm/package.json 是 1.0.0-rc3（连字符形态）、pyproject 是 1.0.0rc3
          # （PEP 440 形态）——统一去掉「连字符 + 预发布前缀」再比，别让形态差异误报版本不一致。
          norm = lambda v: re.sub(r"-(?=(rc|a|b|post|dev)\d)", "", v)
          want = norm(tag[1:])
          raw = json.load(open("npm/package.json", encoding="utf-8"))["version"]
          print(f"tag={tag} -> {want}   npm/package.json={raw} -> {norm(raw)}")
          if norm(raw) != want:
              sys.exit("版本号不一致：tag / npm/package.json")
          PY

      - name: 发布到 npm（trusted publishing，无长期 token）
        working-directory: npm
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          # 预发布版本走 rc 标签，别把 1.0.0-rc3 顶成 latest（与现有 dist-tags 口径一致）
          if [[ "$ver" == *-* ]]; then tag=rc; else tag=latest; fi
          echo "publish mathgen-cli@$ver (dist-tag: $tag)"
          # --provenance：附上可验证的构建来源（OIDC 签名），npm 包页能看到「由哪个仓库的哪个提交构建」
          npm publish --access public --provenance --tag "$tag"

      - name: 回读 registry 确认真的上架了
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/package.json').version")
          # npm 的读取侧有 1–2 分钟异步延迟，刚 PUBLISH 完立刻 npm view 可能拿不到，轮询而不是直接断言
          for i in $(seq 1 12); do
            if npm view "mathgen-cli@$ver" version 2>/dev/null | grep -qx "$ver"; then
              echo "registry 已返回 mathgen-cli@$ver"
              npm view mathgen-cli dist-tags
              exit 0
            fi
            echo "第 $i 次还没读到，等 10 秒"
            sleep 10
          done
          echo "2 分钟内没在 registry 读到 $ver"
          exit 1

  # ------------------------------------------------------------ Docker 镜像
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 多架构：老师多是 Windows/Intel（linux/amd64），Apple Silicon 的 Docker Desktop
      # 拉到的则是 linux/arm64。只用 amd64 镜像时 Apple Silicon 能跑但走模拟，导 PDF 明显变慢。
      # QEMU 只为交叉构建 arm64 用；amd64 仍是原生构建、原生冒烟。
      - name: 准备 QEMU（交叉构建 linux/arm64 用）
        uses: docker/setup-qemu-action@v3

      - name: 准备 buildx（多架构构建器）
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（linux/amd64，本地 load 供下面冒烟）
        run: docker buildx build --platform linux/amd64 --load -t mathgen:ci .

      - name: 浏览器通道自检（导出 503 时就靠它定位）
        run: |
          # PDF 导出的 503（EXPORT_NOT_READY）在容器里几乎总是「找不到 / 起不来 Chromium」。
          # 与其在导出失败后从响应体里猜，不如先直接问它一句。
          cat > /tmp/probe_browser.py <<'PY'
          import os
          from app.export import browser
          print("PLAYWRIGHT_BROWSERS_PATH =", repr(os.environ.get("PLAYWRIGHT_BROWSERS_PATH")))
          print("browsers_root            =", repr(browser._browsers_root()))
          print("chromium_executable      =", repr(browser.chromium_executable()))
          print("is_available             =", browser.is_available())
          try:
              browser.session().browser()
              print("launch                   = OK")
          except Exception as exc:
              print("launch                   = FAIL:", type(exc).__name__, exc)
          PY
          docker run --rm -v /tmp/probe_browser.py:/tmp/probe_browser.py:ro \
            mathgen:ci python /tmp/probe_browser.py

      - name: 冒烟测试（启动 → 出卷 → 真导出一份 PDF）
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 mathgen:ci

          # 任何一步失败都把服务日志与响应体打出来 —— 上一次失败只留下一句
          # 「export pdf = 503, 276 字节」，定位只能靠猜。
          dump() {
            echo "----- 服务日志（tail 60）-----"
            docker logs smoke 2>&1 | tail -60 || true
            echo "----- 最后一次响应体 -----"
            cat /tmp/out.body 2>/dev/null || true
          }
          trap dump EXIT

          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/openapi.json || true)
            if [ "$code" = "200" ]; then ok=yes; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "服务没起来"
            exit 1
          fi
          echo "openapi.json = 200"

          for path in /teacher /student; do
            code=$(curl -s -o /tmp/out.body -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path = $code"
            [ "$code" = "200" ]
          done

          curl -s -o /tmp/out.body -X POST 'http://127.0.0.1:8000/api/papers?seed=1&title=ci-smoke' \
            -H 'content-type: application/json' \
            -d '{"ops":["+"],"ranges":["R1"],"question_type":"oral","count":6}' -w '%{http_code}' > /tmp/out.code
          echo "新建卷 = $(cat /tmp/out.code) $(cat /tmp/out.body)"
          [ "$(cat /tmp/out.code)" = "201" ]
          id=$(python3 -c 'import json,sys; print(json.load(open("/tmp/out.body"))["id"])')
          echo "新建卷 id=$id"

          code=$(curl -s -o /tmp/out.body -w '%{http_code}' "http://127.0.0.1:8000/api/papers/$id/export?format=pdf")
          echo "export pdf = $code, $(stat -c%s /tmp/out.body) 字节"
          [ "$code" = "200" ]
          head -c 4 /tmp/out.body | grep -qa '%PDF'

          code=$(curl -s -o /tmp/out.body -w '%{http_code}' "http://127.0.0.1:8000/api/papers/$id/sheet")
          echo "sheet = $code"
          [ "$code" = "200" ]

          echo "容器日志（tail 20）："
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
          trap - EXIT

      - name: 手动触发时额外验证 arm64 能构建（不推送、不落盘）
        if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'linux/amd64,linux/arm64'
        run: |
          # 本机没有 Docker，arm64 这条路只有 CI 能验。`type=cacheonly` 只要求两个平台都构建成功：
          # 不推 GHCR、不导出镜像、也不假装跑过 arm64 冒烟（QEMU 里跑 Chromium 不可信，见 D87）。
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .

      - name: 推送多架构镜像到 GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/mathgen"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 一次 buildx 构建两个平台并直接推成 manifest list —— `docker pull` 会按宿主机架构
          # 自动选 amd64 或 arm64。上面那次 amd64 构建负责「真的跑起来」，这次负责「两个架构都出」；
          # 同一个 builder 的层缓存会复用 amd64 的成果，时间主要花在 QEMU 里的 arm64。
          args=(--platform linux/amd64,linux/arm64 -t "${image}:${tag}" --push)
          # 预发布（rc / beta）不覆盖 latest，免得把 rc 当成稳定版发出去
          if [[ "$tag" != *-* ]]; then
            args+=(-t "${image}:latest")
          fi
          docker buildx build "${args[@]}" .
          echo "已推送 ${image}:${tag}（linux/amd64 + linux/arm64）"
          # 回读 manifest list：两个平台都在才算成功（只看 push 的退出码可能漏掉单架构 manifest）
          docker buildx imagetools inspect "${image}:${tag}"
